# ---------------------------------------------------------------------------
# By Carly Beauty - configuration nginx
# A placer sur le serveur dans /etc/nginx/sites-available/bycarlybeauty
# puis : ln -s /etc/nginx/sites-available/bycarlybeauty /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# Corrige 3 problemes SEO constates en production :
#   1. www.bycarlybeauty.fr repondait 200 (contenu duplique)  -> 301 vers le
#      domaine sans www
#   2. toute URL inexistante repondait 200 avec la page d'accueil (soft 404)
#      -> vraie erreur 404
#   3. aucun cache navigateur ni compression sur les fichiers statiques
# ---------------------------------------------------------------------------

# 1) http -> https (deja en place, conserve ici pour avoir la conf complete)
server {
    listen 80;
    listen [::]:80;
    server_name bycarlybeauty.fr www.bycarlybeauty.fr;
    return 301 https://bycarlybeauty.fr$request_uri;
}

# 2) www -> non-www (evite le contenu duplique)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bycarlybeauty.fr;

    ssl_certificate     /etc/letsencrypt/live/bycarlybeauty.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bycarlybeauty.fr/privkey.pem;

    return 301 https://bycarlybeauty.fr$request_uri;
}

# 3) site principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bycarlybeauty.fr;

    root /var/www/bycarlybeauty;   # <-- adapter au chemin reel du site
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/bycarlybeauty.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bycarlybeauty.fr/privkey.pem;

    # --- vraie 404 : ne JAMAIS renvoyer index.html en 200 sur une URL inconnue
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- /index.html -> / (une seule URL canonique pour l'accueil)
    location = /index.html {
        return 301 https://bycarlybeauty.fr/;
    }

    # --- compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml;

    # --- cache navigateur
    location ~* \.(?:avif|webp|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(?:xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # --- entetes de securite (bonus, sans impact sur le rendu)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- ne pas exposer les fichiers parasites macOS / git
    location ~ /\.(?:git|DS_Store) {
        deny all;
    }
}
